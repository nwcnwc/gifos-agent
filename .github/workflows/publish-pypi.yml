# Publish the Python package (python/, PyPI gifos-agent) when a py-v* tag (py-v0.1.0, ...) is pushed.
# PyPI trusted publishing: GitHub's OIDC identity replaces any PyPI token. The PyPI project's publisher settings
# name this repo, this file (publish-pypi.yml) and the environment "pypi".
# The npm workflow (publish.yml) triggers on v* tags; a py-v* tag does not match it.
name: publish-pypi

on:
  push:
    tags: ['py-v*']

permissions:
  contents: read
  id-token: write   # the OIDC token PyPI trusts

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Tag matches pyproject.toml version
        run: |
          v="$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")"
          [ "py-v$v" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME != pyproject.toml py-v$v"; exit 1; }
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Build
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check --strict dist/*
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086   # v1.14.3
        with:
          packages-dir: python/dist
