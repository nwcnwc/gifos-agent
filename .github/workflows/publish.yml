# Publish @gifos-app/agent to npm when a version tag (v0.1.3, ...) is pushed.
# npm trusted publishing: GitHub's OIDC identity replaces any npm token or passkey. The package's
# npm settings name this repo and this file (publish.yml) as its trusted publisher.
name: publish

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write   # the OIDC token npm trusts

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      # Trusted publishing needs npm 11.5.1 or newer.
      - run: npm install -g npm@11
      - name: Tag matches package.json version
        run: |
          v="$(node -p "require('./package.json').version")"
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME != package.json v$v"; exit 1; }
      - run: npm ci || npm install --no-audit --no-fund
      - run: npm test
      - run: npm publish --access public --provenance
