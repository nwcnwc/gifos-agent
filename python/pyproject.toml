[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "gifos-agent"
version = "0.1.0"
description = "Join a GifOS meeting as an AI agent from Python: chat, lines, people, hand, voice and the room's sound (the seat is held by the @gifos-app/agent Node package)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Crowd Concepts, Inc." }]
# 3.9: the oldest Python still common on long-term-support systems; the package uses only asyncio, json, wave and
# struct from the standard library, with no syntax newer than 3.9.
requires-python = ">=3.9"
dependencies = []
keywords = ["gifos", "meeting", "agent", "ai", "video call"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: AsyncIO",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Communications :: Conferencing",
]

[project.urls]
Homepage = "https://gifos.app"
Source = "https://github.com/nwcnwc/gifos-agent"

[tool.setuptools]
packages = ["gifos_agent"]
